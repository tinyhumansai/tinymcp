[package]
name = "tinymcp-bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TinyBus wire contract for the tinymcp module: member names, payload types, and the contract version."
documentation = "https://docs.rs/tinymcp-bus"
readme = "README.md"
keywords = ["tinybus", "module", "contract", "mcp"]
categories = ["development-tools", "api-bindings"]
publish = false

# Deliberately dependency-light: this is the crate a host links to talk to the
# loadable module, so it must cost that host almost nothing. Nothing here may
# pull in `tinybus`, an async runtime, an HTTP client, or a native library —
# see `src/lib.rs` for why the transport in particular is absent. CI asserts it.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Canonical storage request vocabulary. Keep default features off so this
# contract crate links neither the storage client nor TinyBus.
tinystoragedrivers-bus = { workspace = true }
# Optional: lets a host generate a settings schema for a user interface from
# these definitions rather than a hand-kept copy. Off by default because a
# host that only makes calls should not pay for it. Pure Rust, no transport.
schemars = { workspace = true, optional = true }
# Decoding a widget document a tool result embedded as a base64 `blob`, for
# the pure tool-UI rules in `ui`. No dependencies of its own.
base64 = { workspace = true }

[dev-dependencies]
# The WHATWG parser the `ui` link splitter must agree with: its differential
# tests check every web link the splitter accepts against `url`'s reading.
url = { workspace = true }
# The pattern the `ui` URL scanner replaced, kept as the scanner's oracle.
regex = { workspace = true }

[features]
default = []
# Derive `JsonSchema` on the configuration payloads. See `src/config/mod.rs`.
schemars = ["dep:schemars"]
# Kept as an empty compatibility feature for callers that enabled the former
# schema projection here. Executable schemas and migrations belong to tinymcp.
storage = []

[lints]
workspace = true
