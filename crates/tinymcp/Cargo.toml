[package]
name = "tinymcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Model Context Protocol client, transports, and server registry, packaged as an installable TinyBus module."
documentation = "https://docs.rs/tinymcp"
readme = "../../README.md"
keywords = ["tinybus", "module", "mcp", "model-context-protocol"]
categories = ["development-tools", "api-bindings"]
publish = false

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# producing the native module artifact that TinyBus loads at runtime.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The wire contract: member names, payload types, and the contract version.
# Re-exported wholesale from `src/lib.rs` so a consumer takes one dependency
# rather than two, and so `tinymcp::GreetRequest` and
# `tinymcp_bus::GreetRequest` are the same type.
tinymcp-bus = { workspace = true }
tinybus = { workspace = true }
tinybus-module = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# The GitHub release verifier passes an explicit empty module configuration.
serde_json = { workspace = true }

[features]
default = []

[lints]
workspace = true
