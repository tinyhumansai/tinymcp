[package]
name = "tinymcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Model Context Protocol client, transports, and server registry, packaged as an installable TinyBus module."
documentation = "https://docs.rs/tinymcp"
readme = "../../README.md"
keywords = ["tinybus", "module", "mcp", "model-context-protocol"]
categories = ["development-tools", "api-bindings"]
publish = false

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# producing the native module artifact that TinyBus loads at runtime.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The wire contract: member names, payload types, and the contract version.
# Re-exported wholesale from `src/lib.rs` so a consumer takes one dependency
# rather than two, and so `tinymcp::GreetRequest` and
# `tinymcp_bus::GreetRequest` are the same type.
tinymcp-bus = { workspace = true }
# Only the `TinyBus` adapter needs these, and only a `cdylib` build needs the
# adapter. A host taking this crate as an ordinary library calls the API
# directly and should not link a bus to do it — see the `module` feature.
tinybus = { workspace = true, optional = true }
tinybus-module = { workspace = true, optional = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The Streamable HTTP server transport. Only `server-http` takes these: a host
# serving MCP over stdio alone, or not serving at all, links neither.
axum = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
# Only the `tools` feature needs these: the `tinytools::Tool` adapter over a
# server's advertised tools. See the note on the workspace entry.
tinytools = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
# `SecretScrubber` (the `tools` feature) parses endpoints for userinfo and
# credential-looking query values, and matches their percent-encoded spellings.
url = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
# Finding URLs in tool results, for the `ui` feature's link extraction.
regex = { workspace = true, optional = true }

[[example]]
name = "verify_module"
required-features = ["module"]

[[example]]
name = "verify_github_release"
required-features = ["module"]

[dev-dependencies]
# `net` stands up the loopback test servers; `test-util` pauses the clock so a
# five-minute timeout is testable without waiting five minutes. The rest comes
# from the ordinary dependency entry above.
tokio = { workspace = true, features = ["net", "test-util"] }
# `form` for the OAuth token endpoint the authorization-flow suite stands up.
axum = { workspace = true, features = ["form"] }
# Temporary directories for the command-resolution tests.
tempfile = { workspace = true }

[features]
default = ["module", "rustls-tls"]
# Build the `TinyBus` adapter and the ABI exports. On by default because the
# released artifact is a loadable module; a host consuming this crate as a path
# dependency turns it off and links neither `tinybus` nor its module SDK.
module = ["dep:tinybus", "dep:tinybus-module"]
# Link the TinyBus module into a host binary with Rust-addressable entry points.
static-link = ["module"]
# Bundle a TLS stack, so a build needs no system OpenSSL. The default.
rustls-tls = ["reqwest/rustls-tls"]
# Use the operating system's TLS stack and certificate store instead. A host
# whose users sit behind a corporate certificate authority installed in the
# system trust store needs this; `rustls-tls` would reject those certificates.
# Enable exactly one.
native-tls = ["reqwest/native-tls"]
# Serve MCP over Streamable HTTP + SSE (`server::run_http`). Off by default: the
# stdio server and the protocol need nothing beyond the base dependencies, and
# a host that does not listen on a socket should not link a server stack.
server-http = ["dep:axum", "dep:tokio-stream", "tokio/net"]
# Expose each server tool as a `tinytools::Tool` (`tinymcp::tools`): stable
# `mcp_<server>_<tool>` names, sanitized descriptions and schemas, direct or
# deferred exposure, and an invoker seam a host wraps with its own policy.
# Off by default so the loadable module does not link the tool vocabulary.
tools = ["dep:tinytools", "dep:async-trait", "dep:anyhow", "dep:url", "dep:urlencoding"]
# Tool-provided UI for hosts (`tinymcp::ui`): widget template resolution,
# widget document checks, link classification, and the widget tool-call and
# rendering policy. Off by default; a host that renders tool UI turns it on.
ui = ["dep:url", "dep:regex"]

[lints]
workspace = true
